bindsym XF86AudioRaiseVolume exec "pactl set-sink-volume @DEFAULT_SINK@ +2%"
bindsym XF86AudioLowerVolume exec "pactl set-sink-volume @DEFAULT_SINK@ -2%"
bindsym XF86AudioMute exec "pactl set-sink-mute @DEFAULT_SINK@ toggle"
bindsym XF86Explorer exec 'pactl set-default-sink "$(pactl --format=json list sinks | jq --raw-output ".[] | .name" | grep -v "$(pactl get-default-sink)" | head -1)"'

bindsym --no-repeat Mod4+h focus left 5px
bindsym --no-repeat Mod4+j focus down 5px
bindsym --no-repeat Mod4+k focus up 5px
bindsym --no-repeat Mod4+l focus right 5px

bindsym Mod4+Shift+h move left 5px
bindsym Mod4+Shift+j move down 5px
bindsym Mod4+Shift+k move up 5px
bindsym Mod4+Shift+l move right 5px

bindsym Mod4+g resize grow width 5px
bindsym Mod4+s resize shrink width 5px
bindsym Mod4+Shift+g resize grow height 5px
bindsym Mod4+Shift+s resize shrink height 5px
bindsym --no-repeat Mod4+m exec "sway-workspace-manager move prev &>/dev/null || sway-workspace-manager move-to-new prev &>/dev/null"
bindsym --no-repeat Mod4+semicolon exec "sway-workspace-manager move next &>/dev/null || sway-workspace-manager move-to-new next &>/dev/null"
bindsym --no-repeat Mod4+comma exec "sway-workspace-manager switch prev &>/dev/null || sway-workspace-manager create prev"
bindsym --no-repeat Mod4+period exec "sway-workspace-manager switch next &>/dev/null || sway-workspace-manager create next"

bindsym --no-repeat Mod4+u exec kitty
# bindsym --no-repeat Mod4+u exec "alacritty msg create-window || alacritty &"
# bindsym --no-repeat Mod4+u exec wezterm
# bindsym --no-repeat Mod4+Control+u exec "kitty --single-instance"
# bindsym --no-repeat Mod4+Shift+u exec kitty
bindsym --no-repeat Mod4+o exec firefox
bindsym --no-repeat Mod4+8 exec thunar
bindsym --no-repeat Mod4+Shift+o exec firefox-developer-edition
bindsym --no-repeat Mod4+Shift+z exec "hyprmag -r 300 -s 6"
# bindsym --no-repeat Mod4+i exec "kitty zsh -c \'while nvim; do true; done\'"
bindsym --no-repeat Mod4+i exec "alacritty -e zsh -c \'while nvim; do true; done\'"
# bindsym --no-repeat Mod4+Control+i exec "export NVIM_APPNAME=$(zenity --entry --entry-text=nvim); test $NVIM_APPNAME && kitty sh -c 'while nvim --cmd :luafile\ /home/caio/.nvim-starter.lua; do true; done'"
bindsym --no-repeat Mod4+y exec "kitty -- zsh -c yazi"

bindsym --no-repeat Mod4+f12 exec "pkill -USR1 waybar"
bindsym --no-repeat Mod4+Control+f12 exec "if systemctl --user is-active waybar.service; then systemctl --user stop waybar.service; else systemctl --user start waybar.service; fi"
bindsym --no-repeat Mod4+f5 reload
bindsym --no-repeat Mod4+f8 fullscreen
bindsym --no-repeat Mod4+f9 exec makoctl dismiss
bindsym --no-repeat Mod4+backspace kill

bindsym --no-repeat Mod4+return exec "$(tofi-drun --font=/usr/share/fonts/noto/NotoSans-Regular.ttf --hint-font=false --ascii-input=true --late-keyboard-init --font-size=13 --anchor=center --width=30% --height=90% --outline-width=0 --border-width=0 --result-spacing=2 --padding-top=2 --padding-bottom=2 --padding-left=2 --padding-right=2 --prompt-text=\"\\$\" --prompt-padding=2 --background-color=efe --text-color=000 --input-color=f44 --selection-color=22d --selection-match-color=2d2 --clip-to-padding=false)"
bindsym --no-repeat Mod4+Control+return exec "$(tofi-run --font=/usr/share/fonts/noto/NotoSans-Regular.ttf --hint-font=false --ascii-input=true --late-keyboard-init --font-size=13 --anchor=center --width=30% --height=90% --outline-width=0 --border-width=0 --result-spacing=2 --padding-top=2 --padding-bottom=2 --padding-left=2 --padding-right=2 --prompt-text=\"\\$\" --prompt-padding=2 --background-color=efe --text-color=000 --input-color=f44 --selection-color=22d --selection-match-color=2d2 --clip-to-padding=false)"

bindsym --no-repeat Mod4+dead_tilde floating toggle
bindsym --no-repeat Mod4+dead_acute border toggle
bindsym --no-repeat print exec 'F=$(date +/home/caio/pic/screenshots/%Y_%m_%d__%H_%M_%S_$(( $(date +%N) / 1000000 )).png); grim -t png -l 9 $F; wl-copy <$F'
bindsym --no-repeat Mod4+print exec 'F=$(date +/home/caio/pic/screenshots/%Y_%m_%d__%H_%M_%S_$(( $(date +%N) / 1000000 )).png); grim -g "$(slurp)" -t png -l 9 $F; wl-copy <$F'
bindsym --no-repeat Mod4+slash focus mode_toggle
bindsym --no-repeat Mod4+minus layout toggle split
bindsym --no-repeat Mod4+shift+comma focus child
bindsym --no-repeat Mod4+shift+period focus parent
# bindsym --no-repeat Mod4+ccedilla exec swaylock
bindsym --no-repeat --locked Mod4+1 output HDMI-A-1 power toggle
bindsym --no-repeat --locked Mod4+2 output eDP-1 power toggle

floating_modifier Mod4
