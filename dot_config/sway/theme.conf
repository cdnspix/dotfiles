default_border pixel 5
default_floating_border pixel 5
smart_borders on
hide_edge_borders both
floating_maximum_size 1920 x 1080
focus_follows_mouse no
focus_on_window_activation none
focus_wrapping no
seat * xcursor_theme default 96
for_window [title="."] title_format "%title - %app_id"
for_window [app_id="pavucontrol-qt"] floating enable; resize set height 700px
for_window [title="Pianoteq.*"] floating enable
for_window [app_id=".*-floating"] floating enable; resize set width 1600px; resize set height 900px
for_window [app_id="kitty-floating"] floating enable; resize set width 120px; resize set height 80px; shortcuts_inhibitor enable
for_window [app_id=".*-fullscreen"] fullscreen enable
for_window [title=".*Qsynth.*"] floating enable
xwayland enable
